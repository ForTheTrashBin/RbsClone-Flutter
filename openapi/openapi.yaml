          minLength: 1
          type: string
        risktype:
          description: This risk profile of this country
          format: int16
          minimum: 0
          type: integer
        shortcode:
          description: A unique short name for this data
          maxLength: 2
          minLength: 2
          type: string
      required:
        - shortcode
        - name
        - flags
        - risktype
      type: object
    Custodian:
      additionalProperties: false
      properties:
        depotno:
          description: This dopot numer assocciated with this custodian
          maxLength: 10
          type: string
