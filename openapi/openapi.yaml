paths:
  /country:
    get:
      description: Get a list of all countries
      operationId: getCountries
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/CountryListItem"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a list of all countries
      tags:
        - Country
    post:
      description: Create a new country
      operationId: createCountry
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountryNoPK"
        required: true
      responses:
        "204":
          description: No Content
          headers:
            id:
              schema:
                description: Generated id for newly created data
                format: uuid
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a new country
      tags:
        - Country
  /country/id/{id}:
    get:
      description: Get a single country based on the id supplied
      operationId: getCountryById
      parameters:
        - description: This is the unique identifier a this data
          in: path
          name: id
