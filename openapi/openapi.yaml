components:
  schemas:
    Country:
      additionalProperties: false
      properties:
        flags:
          description: Some binary encoded flags for this data (see external documentation)
          format: int16
          minimum: 0
          type: integer
        ibanlenth:
          description: The exact length of the IBAN required in that country
          format: int16
          minimum: 0
          type: integer
        id:
          description: This is the unique identifier a this data
          format: uuid
          type: string
        name:
          description: A longer more descriptive description of this data
          maxLength: 30
          minLength: 1
          type: string
        risktype:
          description: This risk profile of this country
          format: int16
          minimum: 0
          type: integer
        shortcode:
          description: A unique short name for this data
          maxLength: 2
          minLength: 2
          type: string
      required:
        - id
        - shortcode
        - name
        - flags
        - risktype
      type: object
    CountryListItem:
      additionalProperties: false
      properties:
        id:
          description: This is the unique identifier a this data
