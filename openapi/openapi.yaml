          type: string
        name:
          description: A longer more descriptive description of this data
          maxLength: 30
          minLength: 1
          type: string
        shortcode:
          description: A unique short name for this data
          maxLength: 2
          minLength: 2
          type: string
      required:
        - id
        - shortcode
        - name
      type: object
    CountryNoPK:
      additionalProperties: false
